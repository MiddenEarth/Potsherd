<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potshed</title>
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>

<body>
        <h1 class="map-title">Potsherd Map</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <div class="map-container">
    <form id="coordinate-form">
    <label for="latitude">Enter Latitude:</label>
<input
  type="text"
  id="latitude"
  name="latitude"
  required
  minlength="4"
  maxlength="8"
  size="10" 
  placeholder="Enter Latitude"/>

        <label for="longitude">Enter Longitude:</label>

<input
  type="text"
  id="longitude"
  name="longitude"
  required
  minlength="4"
  maxlength="8"
  size="10" 
  placeholder="Enter Longitude"/>
<button class="submit-button" id="submit-button" type="button">Submit</button>
    </form>
    <div id="map"></div>
</div>
<script src="script.js"></script>
</body>


</html>
