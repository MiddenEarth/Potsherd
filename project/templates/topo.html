<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TopoView Footprint Test</title>

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #map {
            height: 100%;
        }

        #info {
            position: absolute;
            z-index: 1000;
            top: 10px;
            left: 50px;
            width: 320px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            box-shadow: 0 1px 7px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

<body>

<div id="info">
    Searching for a TopoView map footprint...
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const latitude = 34.24;
    const longitude = -118.82;

    const map = L.map("map").setView(
        [latitude, longitude],
        12
    );

    const streetLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,

            attribution:
                "Tiles &copy; Esri — Sources: Esri, Garmin, USGS, " +
                "NPS, and the GIS User Community"
        }
    ).addTo(map);

    const usgsTopo = L.tileLayer(
        "https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 16,
            attribution: "Map data: USGS The National Map"
        }
    );

    // Layer switcher in the top-right corner: pick Street map or USGS Topo.
    L.control.layers(
        { "Street map": streetLayer, "USGS Topo": usgsTopo }
    ).addTo(map);
    
    //TEST LOCATION
    /*L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,

            attribution:
                "Tiles &copy; Esri — Sources: Esri, Garmin, USGS, " +
                "NPS, and the GIS User Community"
        }
    ).addTo(map);*/
    //TEST LOCATION
    
    const searchMarker = L.marker([
        latitude,
        longitude
    ])
        .addTo(map)
        .bindPopup(`
            Search point<br>
            Latitude: ${latitude}<br>
            Longitude: ${longitude}
        `)
        .openPopup();

    const info = document.getElementById("info");

    function updateInfo(message) {
        info.innerHTML = message;
    }

    updateInfo("Requesting TopoView footprint...");

    // Ask OUR Flask server (same origin, so no CORS); it asks USGS for us.
    fetch(`/api/topoview?lat=${latitude}&lng=${longitude}`)
        .then(function(res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        })
        .then(function(response) {
            console.log(
                "TopoView response:",
                response
            );
            if (
                !response.features ||
                response.features.length === 0
            ) {
                updateInfo(
                    "No historical map footprint was found at this location."
                );
                return;
            }

            const footprintLayer = L.geoJSON(
                response,
                {
                    style: {
                        color: "blue",
                        weight: 3,
                        fillColor: "#3388ff",
                        fillOpacity: 0.2
                    },

                    onEachFeature: function(
                        feature,
                        layer
                    ) {
                        const properties =
                            feature.properties;

                        const mapName =
                            properties.map_name ||
                            "Unknown";

                        const mapYear =
                            properties.imprint_year ||
                            "Unknown";

                        const mapScale =
                            properties.map_scale ||
                            "Unknown";

                        const scanId =
                            properties.scan_id ||
                            "Unknown";

                        layer.bindPopup(`
                            <strong>${mapName}</strong><br>
                            Year: ${mapYear}<br>
                            Scale: ${mapScale}<br>
                            Scan ID: ${scanId}
                        `);
                    }
                }
            ).addTo(map);

            const bounds = footprintLayer.getBounds();
            if(bounds.isValid()){
                map.fitBounds(bounds);
            }

                        // List every map sheet that covers this point, newest first.
            const listItems = response.features.map(function(feature) {
                const p = feature.properties;

                const name  = p.map_name || "Unknown";
                const year  = p.imprint_year || "year unknown";
                const scale = p.map_scale
                    ? "1:" + Number(p.map_scale).toLocaleString()
                    : "scale unknown";

                const link = p.download_url
                    ? `<br><a href="${p.download_url}" target="_blank" rel="noopener">Download map (GeoTIFF)</a>`
                    : "";

                return `<li style="margin-bottom:6px;">
                            <strong>${name}</strong><br>
                            ${year} &middot; ${scale}${link}
                        </li>`;
            });

            // Let the panel scroll if there are many maps.
            info.style.maxHeight = "60vh";
            info.style.overflowY = "auto";

            updateInfo(`
                <strong>${response.features.length} maps found at this point</strong>
                <ol style="padding-left:20px; margin:8px 0 0;">
                    ${listItems.join("")}
                </ol>
            `);
        })
        .catch(function(error) {
            console.error("TopoView request failed:", error);

            updateInfo(`
                <strong>TopoView request failed.</strong><br><br>
                Check the browser console for details.
            `);
        });
</script>

</body>
</html>
