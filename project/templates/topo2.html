<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TopoView Image Test</title>

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #map {
            height: 100%;
        }

        #info {
            position: absolute;
            z-index: 1000;
            top: 10px;
            left: 50px;
            width: 320px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            box-shadow: 0 1px 7px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

<body>

<div id="info">
    Searching for a TopoView map...
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>

<script>
    const latitude = 34.25;
    const longitude = -118.813;

    const map = L.map("map").setView(
        [latitude, longitude],
        12
    );

    const streetLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,

            attribution:
                "Tiles &copy; Esri — Sources: Esri, Garmin, USGS, " +
                "NPS, and the GIS User Community"
        }
    ).addTo(map);

    const usgsTopo = L.tileLayer(
        "https://basemap.nationalmap.gov/arcgis/rest/services/" +
        "USGSTopo/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 16,
            attribution:
                "Map data: USGS The National Map"
        }
    );

    const layerControl = L.control.layers(
        {
            "Street map": streetLayer,
            "USGS Topo": usgsTopo
        }
    ).addTo(map);

    const searchMarker = L.marker([
        latitude,
        longitude
    ])
        .addTo(map)
        .bindPopup(`
            Search point<br>
            Latitude: ${latitude}<br>
            Longitude: ${longitude}
        `)
        .openPopup();

    const info =
        document.getElementById("info");

    function updateInfo(message) {
        info.innerHTML = message;
    }

    /*
     * This is the parent ArcGIS MapServer.
     *
     * It renders the TopoView coverage layer as an image
     * instead of drawing GeoJSON polygons manually.
     */
    const topoViewMapService =
        "https://ngmdb.usgs.gov/arcgis/rest/services/" +
        "topoview/ustOverlay/MapServer";

    const topoViewImageLayer =
        L.esri.dynamicMapLayer({
            url: topoViewMapService,
            opacity: 0.8,
            transparent: true,
            format: "png32",
            layers: [0]
        });

    layerControl.addOverlay(
        topoViewImageLayer,
        "TopoView image layer"
    );

    topoViewImageLayer.on(
        "load",
        function() {
            console.log(
                "TopoView image layer loaded."
            );
        }
    );

    topoViewImageLayer.on(
        "requesterror",
        function(error) {
            console.error(
                "TopoView image layer failed:",
                error
            );

            updateInfo(`
                <strong>Map information loaded,</strong><br>
                but the TopoView image layer failed.
            `);
        }
    );

    updateInfo(
        "Requesting TopoView map information..."
    );

    /*
     * Ask your Flask server for the footprint metadata.
     * The Flask server then asks USGS.
     */
    fetch(
        `/api/topoview?lat=${latitude}&lng=${longitude}`
    )
        .then(function(response) {
            if (!response.ok) {
                throw new Error(
                    "Backend HTTP error: " +
                    response.status
                );
            }

            return response.json();
        })
        .then(function(response) {
            console.log(
                "TopoView response:",
                response
            );

            if (
                !response.features ||
                response.features.length === 0
            ) {
                updateInfo(
                    "No historical map was found at this location."
                );

                return;
            }

            /*
             * Create a temporary invisible GeoJSON object
             * only to obtain the returned map bounds.
             */
            const footprintGeometry =
                L.geoJSON(response);

            const bounds =
                footprintGeometry.getBounds();

            if (bounds.isValid()) {
                map.fitBounds(bounds);
            }

            /*
             * Add the server-rendered image layer
             * after the map record has been found.
             */
            topoViewImageLayer.addTo(map);

            const firstMap =
                response.features[0].properties;

            const mapName =
                firstMap.map_name ||
                "Unknown";

            const mapYear =
                firstMap.imprint_year ||
                "Unknown";

            const mapScale =
                firstMap.map_scale ||
                "Unknown";

            const drgName =
                firstMap.drg_name ||
                "Unknown";

            const scanId =
                firstMap.scan_id ||
                "Unknown";

            updateInfo(`
                <strong>Historical map found</strong><br><br>

                <strong>Name:</strong>
                ${mapName}<br>

                <strong>Year:</strong>
                ${mapYear}<br>

                <strong>Scale:</strong>
                ${mapScale}<br>

                <strong>DRG name:</strong>
                ${drgName}<br>

                <strong>Scan ID:</strong>
                ${scanId}<br><br>

                <strong>TopoView image layer:</strong>
                requested
            `);
        })
        .catch(function(error) {
            console.error(
                "TopoView request failed:",
                error
            );

            updateInfo(`
                <strong>TopoView request failed.</strong><br><br>
                ${error.message}
            `);
        });
</script>

</body>
</html>
