<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDA Soil Survey Circle</title>

    <!-- Leaflet CSS -->
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            padding: 10px;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 85vh;
        }
    </style>
</head>

<body>
<h2>USDA Soil Survey — 1 km Radius</h2>
<div id="map"></div>

<!-- Load Leaflet first -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Load the WMS clipping plugin -->
<script src="https://cdn.jsdelivr.net/gh/amanchry/leaflet-wms-crop@latest/leaflet-wms-crop.js"></script>

<script>
    // Center coordinates: [latitude, longitude]
    const center = [34.26833935, -118.50189743];
    const radius = 1000;
    const earthRadius = 6371000;

    // Create the map
    const map = L.map("map").setView(center, 14);

    // Background street map
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    // Generate points around the 1,000-meter circle
    const boundary = [];
    const lat0 = center[0] * Math.PI / 180;
    const lon0 = center[1] * Math.PI / 180;
    const angularDistance = radius / earthRadius;

    for (let i = 0; i <= 128; i++) {
        const bearing = 2 * Math.PI * i / 128;

        const lat = Math.asin(
            Math.sin(lat0) * Math.cos(angularDistance) +
            Math.cos(lat0) * Math.sin(angularDistance) *
            Math.cos(bearing)
        );

        const lon = lon0 + Math.atan2(
            Math.sin(bearing) * Math.sin(angularDistance) *
            Math.cos(lat0),
            Math.cos(angularDistance) -
            Math.sin(lat0) * Math.sin(lat)
        );

        boundary.push([
            lat * 180 / Math.PI,
            lon * 180 / Math.PI
        ]);
    }

    // Add the clipped USDA soil layer
    const soilLayer = L.tileLayer.wms.clipped(
        "https://sdmdataaccess.sc.egov.usda.gov/Spatial2/service.ows",
        {
            layers: "MapunitPoly",
            styles: "",
            format: "image/png",
            transparent: true,
            version: "1.3.0"
        },
        boundary
    ).addTo(map);

    // Draw the blue circle outline
    L.circle(center, {
        radius: radius,
        color: "blue",
        weight: 3,
        fill: false
    }).addTo(map);

    // Report loading errors
    soilLayer.on("tileerror", function (event) {
        console.error("USDA soil tile error:", event);
    });

    console.log("Map initialized.");
</script>
</body>
</html>
