<!DOCTYPE html>
<html>
<head>
    <title>USDA Soil Survey Test</title>
</head>
<body>
<h2>USDA Soil Survey Test</h2>
<button onclick="getSoilData()">Get Soil Data</button>
<pre id="result">Click the button to start.</pre>

<script>
    async function getSoilData() {
        const result = document.getElementById("result");
        result.textContent = "Loading soil data...";

        const polygonWKT = `
        POLYGON ((
          -118.50189743 34.26833935,
          -118.50109674 34.22326209,
          -118.55536271 34.22258573,
          -118.55619232 34.26766185,
          -118.50189743 34.26833935
        ))
      `;

        const query = `
        SELECT DISTINCT
          M.mukey,
          M.musym,
          M.muname,
          L.areasymbol
        FROM SDA_Get_Mukey_from_intersection_with_WktWgs84(
          '${polygonWKT}'
        ) AS S
        JOIN mapunit AS M ON M.mukey = S.mukey
        JOIN legend AS L ON L.lkey = M.lkey
        ORDER BY M.musym
      `;

        try {
            const response = await fetch(
                "https://SDMDataAccess.sc.egov.usda.gov/Tabular/post.rest",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        query: query,
                        format: "JSON"
                    })
                }
            );

            if (!response.ok) {
                throw new Error("HTTP error: " + response.status);
            }

            const data = await response.json();
            result.textContent = JSON.stringify(data, null, 2);

        } catch (error) {
            result.textContent = "Error: " + error.message;
        }
    }
</script>
</body>
</html>
